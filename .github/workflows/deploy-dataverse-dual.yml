name: Deploy Dataverse Sample (Power Apps + SWA)

on:
  push:
    branches:
      - main
    paths:
      - 'samples/Dataverse/**'
      - '.github/workflows/deploy-dataverse-dual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/Dataverse
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples/Dataverse/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataverse-dist
          path: samples/Dataverse/dist

  deploy-powerapps:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.PP_APPLICATION_ID != '' && secrets.PP_CLIENT_SECRET != '' && secrets.PP_TENANT_ID != '' && secrets.PP_ENVIRONMENT_ID != '' }}
    defaults:
      run:
        working-directory: samples/Dataverse
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples/Dataverse/package-lock.json

      - name: Install PAC CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Authenticate PAC
        run: |
          pac auth create \
            --applicationId "${{ secrets.PP_APPLICATION_ID }}" \
            --clientSecret "${{ secrets.PP_CLIENT_SECRET }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --environment "${{ secrets.PP_ENVIRONMENT_ID }}"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Push to Power Apps
        run: pac code push --environment "${{ secrets.PP_ENVIRONMENT_ID }}"

  deploy-swa:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dataverse-dist
          path: dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
